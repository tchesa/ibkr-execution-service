# Local Postgres for running the service against the fake broker or a local IB Gateway.
#   docker compose up -d
#   export DATABASE_URL=postgresql+asyncpg://ibkr:ibkr@localhost:55432/ibkr_exec
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibkr
      POSTGRES_PASSWORD: ibkr
      POSTGRES_DB: ibkr_exec
    ports:
      - "127.0.0.1:55432:5432"   # 55432 so a local Postgres on 5432 is left alone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibkr -d ibkr_exec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
